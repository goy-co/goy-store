syntax = "proto3";

package goy.store.v1;

option go_package = "github.com/goy-co/goy-store/go;goy_store";

// ============================================================================
// KV Store Contract
// ============================================================================

service KvStore {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Exists(ExistsRequest) returns (ExistsResponse);
  rpc SetIfNotExists(SetIfNotExistsRequest) returns (SetIfNotExistsResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message SetRequest {
  string key = 1;
  bytes value = 2;
  optional int64 ttl_seconds = 3;
}

message SetResponse {
  bool success = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message ExistsRequest {
  string key = 1;
}

message ExistsResponse {
  bool exists = 1;
}

message SetIfNotExistsRequest {
  string key = 1;
  bytes value = 2;
  optional int64 ttl_seconds = 3;
}

message SetIfNotExistsResponse {
  bool inserted = 1;
}

// ============================================================================
// Relational Store Contract
// ============================================================================

service RelationalStore {
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Migrate(MigrateRequest) returns (MigrateResponse);
}

message QueryRequest {
  string sql = 1;
  repeated bytes params = 2;
}

message QueryResponse {
  repeated Row rows = 1;
}

message Row {
  repeated bytes columns = 1;
}

message ExecuteRequest {
  string sql = 1;
  repeated bytes params = 2;
}

message ExecuteResponse {
  uint64 rows_affected = 1;
}

message MigrateRequest {
  repeated Migration migrations = 1;
}

message Migration {
  string version = 1;
  string up_sql = 2;
  string down_sql = 3;
}

message MigrateResponse {
  bool success = 1;
  string applied_version = 2;
}

// ============================================================================
// Sorted Set Store Contract
// ============================================================================

service SortedSetStore {
  rpc Add(AddRequest) returns (AddResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  rpc RangeByScore(RangeByScoreRequest) returns (RangeByScoreResponse);
  rpc Count(CountRequest) returns (CountResponse);
  rpc RemoveRange(RemoveRangeRequest) returns (RemoveRangeResponse);
}

message AddRequest {
  string set = 1;
  string member = 2;
  double score = 3;
}

message AddResponse {
  bool success = 1;
}

message RemoveRequest {
  string set = 1;
  string member = 2;
}

message RemoveResponse {
  bool success = 1;
}

message RangeByScoreRequest {
  string set = 1;
  double min = 2;
  double max = 3;
  optional uint32 limit = 4;
}

message RangeByScoreResponse {
  repeated ScoredMember members = 1;
}

message ScoredMember {
  string member = 1;
  double score = 2;
}

message CountRequest {
  string set = 1;
}

message CountResponse {
  uint64 count = 1;
}

message RemoveRangeRequest {
  string set = 1;
  double min = 2;
  double max = 3;
}

message RemoveRangeResponse {
  uint64 removed_count = 1;
}

// ============================================================================
// Pub/Sub Store Contract
// ============================================================================

service PubSubStore {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Subscribe(SubscribeRequest) returns (stream Message);
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
}

message PublishRequest {
  string channel = 1;
  bytes message = 2;
}

message PublishResponse {
  bool success = 1;
}

message SubscribeRequest {
  repeated string channels = 1;
}

message Message {
  string channel = 1;
  bytes payload = 2;
  int64 timestamp = 3;
}

message UnsubscribeRequest {
  repeated string channels = 1;
}

message UnsubscribeResponse {
  bool success = 1;
}

// ============================================================================
// Blob Store Contract
// ============================================================================

service BlobStore {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetBlobRequest) returns (GetBlobResponse);
  rpc Delete(DeleteBlobRequest) returns (DeleteBlobResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc PresignUrl(PresignUrlRequest) returns (PresignUrlResponse);
}

message PutRequest {
  string key = 1;
  bytes data = 2;
  optional Metadata metadata = 3;
}

message Metadata {
  string content_type = 1;
  map<string, string> custom = 2;
}

message PutResponse {
  bool success = 1;
}

message GetBlobRequest {
  string key = 1;
}

message GetBlobResponse {
  bool found = 1;
  bytes data = 2;
  optional Metadata metadata = 3;
}

message DeleteBlobRequest {
  string key = 1;
}

message DeleteBlobResponse {
  bool success = 1;
}

message ListRequest {
  optional string prefix = 1;
}

message ListResponse {
  repeated string keys = 1;
}

message PresignUrlRequest {
  string key = 1;
  int64 expiry_seconds = 2;
}

message PresignUrlResponse {
  string url = 1;
}