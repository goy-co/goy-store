name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check-and-test:
    name: Rust Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check Rust Formatting
        run: cd rust && cargo fmt -- --check

      - name: Run Clippy
        run: cd rust && cargo clippy --all-features -- -D warnings

      - name: Run Unit Tests
        run: cd rust && cargo test

  go-check-and-test:
    name: Go Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum

      - name: Run Go Vet
        run: cd go && go vet ./...

      - name: Run Unit Tests
        run: cd go && go test -v ./...

  e2e:
    name: E2E Integration Tests
    needs: [rust-check-and-test, go-check-and-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum

      - name: Start Test Infrastructure
        run: docker compose up -d --wait

      - name: Run Rust E2E Tests
        run: cd rust && cargo test --test e2e --all-features -- --test-threads=1

      - name: Run Go E2E Tests
        run: cd go && go test -tags=e2e -v ./e2e/...

      - name: Stop Test Infrastructure
        if: always()
        run: docker compose down -v
