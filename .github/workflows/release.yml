name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.1.0-alpha)'
        required: true
        type: string
      dry_run:
        description: 'Dry run release without publishing artifacts'
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  e2e-validate:
    name: E2E Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Start Test Infrastructure
        run: docker compose up -d --wait

      - name: Run Rust E2E Tests
        run: cd rust && cargo test --test e2e --all-features -- --test-threads=1

      - name: Run Go E2E Tests
        run: cd go && go test -tags=e2e -v ./e2e/...

      - name: Stop Test Infrastructure
        if: always()
        run: docker compose down -v

  publish-rust:
    name: Package & Publish Rust Crate
    needs: e2e-validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Package
        run: cd rust && cargo package --all-features

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          cd rust
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run - skipping cargo publish"
            cargo publish --dry-run --all-features
          elif [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is required for publishing"
            exit 1
          else
            echo "::notice::Publishing crate to crates.io"
            cargo publish --all-features --token "$CARGO_REGISTRY_TOKEN"
          fi

  verify-go-module:
    name: Verify Go Module
    needs: e2e-validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify module integrity
        run: cd go && go mod verify

      - name: Test module consumption
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cd /tmp
          rm -rf goy-store-consumer-test
          mkdir goy-store-consumer-test
          cd goy-store-consumer-test
          go mod init goy-store-consumer-test
          go get github.com/goy-co/goy-store/go@$TAG
          go mod tidy
          go list -m all | grep goy-store

  create-release:
    name: Create GitHub Release
    needs: [publish-rust, verify-go-module]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          
          # Check if pre-release
          if [[ "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Install git-cliff
        run: |
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          sudo mv git-cliff-2.13.1/git-cliff /usr/local/bin/git-cliff

      - name: Generate Release Changelog with git-cliff
        run: git-cliff --config cliff.toml --latest --strip header --output RELEASE_CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_CHANGELOG.md
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
