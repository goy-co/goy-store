services:
  redis:
    image: redis:7-alpine
    container_name: goy-store-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - goy-store-test-net

  postgres:
    image: postgres:16-alpine
    container_name: goy-store-test-postgres
    environment:
      POSTGRES_DB: goy_store_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d goy_store_test"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - goy-store-test-net

  minio:
    image: minio/minio:latest
    container_name: goy-store-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - goy-store-test-net

networks:
  goy-store-test-net:
    driver: bridge
