[package]
name = "goy-store"
version = "0.1.0"
edition = "2024"
authors = ["The Goy Company"]
description = "Unified persistence abstraction for the Goy Platform"
license = "Proprietary"
repository = "https://github.com/goy-co/goy-store"

[lib]
name = "goy_store"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
prometheus = "0.13"

# Logging
tracing = "0.1"

# Configuration
toml = "0.8"

# Backends (optional, feature-gated)
# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }
# PostgreSQL / SQLite
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid"], optional = true }
# S3
aws-sdk-s3 = { version = "1", optional = true }
# NATS
async-nats = { version = "0.35", optional = true }

[features]
default = ["memory"]
memory = []
redis-backend = ["dep:redis"]
sqlx-backend = ["dep:sqlx"]
s3-backend = ["dep:aws-sdk-s3"]
nats-backend = ["dep:async-nats"]
all-backends = ["redis-backend", "sqlx-backend", "s3-backend", "nats-backend"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"